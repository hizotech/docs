openapi: 3.0.3
info:
  title: Glyde Public API
  description: Glyde API for payments, collections, transfers, and virtual accounts
  version: 1.0.0
servers:
  - url: https://api.useglyde.co
    description: Production
  - url: https://sandbox.useglyde.co
    description: Sandbox
paths:
  /v1/account-enquiry:
    get:
      summary: Resolve Account Name
      operationId: resolveAccountName
      description: >-
        Verify a Nigerian bank account before initiating a transfer. Returns the account holder's
        name. There is no name enquiry rail for ZAR; rand payouts carry `account_name` on the
        transfer request instead.
      tags:
        - Account
      parameters:
        - name: account_number
          in: query
          required: true
          schema:
            type: string
          description: The recipient's 10-digit Nigerian account number
          example: "0264341458"
        - name: bank_code
          in: query
          required: true
          schema:
            type: string
          description: The bank code from /banks endpoint
          example: "058"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Account retrieved
                  data:
                    type: object
                    properties:
                      bank_name:
                        type: string
                        example: GTBank
                      account_name:
                        type: string
                        example: John Doe
                      account_number:
                        type: string
                        example: "0264341458"
        "400":
          description: Account enquiry failed
        "422":
          description: Validation error

  /v1/banks:
    get:
      summary: List Banks
      operationId: listBanks
      description: >-
        Retrieve all active banks supported for transfers, across every market Glyde pays out to.
        Nigerian banks carry 3-digit CBN codes; South African banks carry 6-digit universal branch
        codes. A payout is rejected if the bank code belongs to a market other than the payout
        currency's.
      tags:
        - Account
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: GTBank
                        code:
                          type: string
                          example: "058"

  /v1/collection/initialise:
    post:
      summary: Initialize Collection Request
      operationId: initializeCollection
      description: Create a payment page URL for customers to complete payment.
      tags:
        - Collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currency
                - reference
                - amount
                - customer
                - channels
              properties:
                currency:
                  type: string
                  description: >-
                    ISO code of the collection currency. Collections are available in NGN only.
                  enum: [NGN]
                  example: NGN
                reference:
                  type: string
                  example: order_12345678
                amount:
                  type: integer
                  example: 10000
                customer:
                  type: object
                  properties:
                    name:
                      type: string
                      example: John Doe
                    email:
                      type: string
                      example: john.doe@example.com
                    phone:
                      type: string
                      example: "08012345678"
                channels:
                  type: array
                  items:
                    type: string
                    enum: [card_payment, bank_transfer]
                default_channel:
                  type: string
                  enum: [card_payment, bank_transfer]
                meta:
                  type: object
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collection Request created successfully
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: https://pay.useglyde.io/f369f561-aaa4-4701-aeb1-ce79f438efc1

  /v1/collection/bank-transfer:
    post:
      summary: Create Bank Transfer Collection
      operationId: createBankTransferCollection
      description: Create a collection with a virtual bank account for payment.
      tags:
        - Collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currency
                - reference
                - amount
                - customer_name
                - customer_email
              properties:
                currency:
                  type: string
                  description: >-
                    ISO code of the collection currency. Collections are available in NGN only.
                  enum: [NGN]
                  example: NGN
                reference:
                  type: string
                  example: order_12345678
                amount:
                  type: integer
                  example: 10000
                customer_name:
                  type: string
                  example: John Doe
                customer_email:
                  type: string
                  example: john.doe@example.com
                customer_phone:
                  type: string
                  example: "08012345678"
                meta:
                  type: object
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      reference:
                        type: string
                      account_number:
                        type: string
                      account_name:
                        type: string
                      bank_name:
                        type: string
                      amount:
                        type: integer
                      fee:
                        type: integer
                      expires_at:
                        type: string

  /v1/collection/{reference}:
    get:
      summary: Fetch Collection Transaction
      operationId: fetchCollectionTransaction
      description: Retrieve the transaction for a collection request.
      tags:
        - Collection
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
          description: The collection reference
      responses:
        "200":
          description: Success
        "404":
          description: Transaction not found

  /v1/transfer/initiate:
    post:
      summary: Initiate Transfer
      operationId: initiateTransfer
      description: |
        Initiate a bank transfer to a recipient's account.

        Payouts are available in NGN and ZAR. The transfer debits the wallet of the currency it
        names, falling back to your business' home currency when `currency` is omitted. Bank
        codes are only unique within a market, so the code must belong to the payout currency's
        country.

        ZAR has no account name enquiry rail, so rand payouts must carry `account_name` and may
        carry `account_type`.
      tags:
        - Transfers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - bank_code
                - account_number
                - reference
              properties:
                amount:
                  type: integer
                  description: >-
                    The transfer amount in major units of the payout currency (5000 = NGN 5,000).
                    Must be within your configured minimum and maximum limits.
                  example: 5000
                currency:
                  type: string
                  description: >-
                    Uppercase ISO code of the wallet to debit. Defaults to your business' home
                    currency. Only currencies cleared for payouts are accepted.
                  enum: [NGN, ZAR]
                  example: ZAR
                bank_code:
                  type: string
                  description: >-
                    The recipient's bank code from /v1/banks. 3-digit CBN codes for NGN,
                    6-digit universal branch codes for ZAR.
                  example: "058"
                account_number:
                  type: string
                  description: The recipient's account number. 10 digits for NGN, 7-11 digits for ZAR.
                  example: "0264341458"
                reference:
                  type: string
                  description: Your unique reference for this transfer, used for idempotency and tracking.
                  example: txn_abc123xyz
                account_name:
                  type: string
                  description: >-
                    The recipient's account name. Required for ZAR payouts, where no name enquiry
                    rail exists. Ignored for NGN, which resolves the name through the provider.
                  example: Thabo Mokoena
                account_type:
                  type: string
                  description: The recipient's account type. Used for ZAR payouts only.
                  enum: [savings, current, cheque]
                  example: savings
            examples:
              naira:
                summary: Naira payout
                value:
                  amount: 5000
                  currency: NGN
                  bank_code: "058"
                  account_number: "0264341458"
                  reference: txn_abc123xyz
              rand:
                summary: Rand payout
                value:
                  amount: 750
                  currency: ZAR
                  bank_code: "250655"
                  account_number: "123456789"
                  account_name: Thabo Mokoena
                  account_type: savings
                  reference: txn_abc123xyw
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Transaction initiated successfully
                  data:
                    type: object
                    properties:
                      reference:
                        type: string
                      merchant_reference:
                        type: string
                      type:
                        type: string
                        example: debit
                      amount:
                        type: string
                        description: The amount in major units of the payout currency, as a string.
                        example: "5000"
                      status:
                        type: string
                        example: pending
                      fee:
                        type: string
                        description: The fee charged, priced in the payout currency.
                        example: "25"
                      created_at:
                        type: string
        "422":
          description: >-
            Validation error, unsupported currency, insufficient funds, unrecognized bank code,
            duplicate reference, or a limit breach.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  message:
                    type: string
                    example: The provided currency is not supported.
                  data:
                    type: object
                    nullable: true
                  errors:
                    type: object
                    nullable: true
        "401":
          description: Unauthenticated

  /v1/transactions:
    get:
      summary: List Transactions
      operationId: listTransactions
      description: Retrieve a paginated list of all transactions.
      tags:
        - Transactions
      parameters:
        - name: perPage
          in: query
          schema:
            type: integer
            default: 25
          description: Items per page (10-50)
      responses:
        "200":
          description: Success

  /v1/transaction/{reference}:
    get:
      summary: Fetch Transaction
      operationId: fetchTransaction
      description: Retrieve details of a specific transaction.
      tags:
        - Transactions
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
        "404":
          description: Transaction not found

  /v1/settlement:
    get:
      summary: List Settlements
      operationId: listSettlements
      description: Retrieve a paginated list of settlements.
      tags:
        - Settlements
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Success

  /v1/settlement/{id}:
    get:
      summary: Get Settlement Details
      operationId: getSettlementDetails
      description: Retrieve details of a specific settlement.
      tags:
        - Settlements
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success

  /v1/check-balance:
    get:
      summary: Check Wallet Balance
      operationId: checkWalletBalance
      description: >-
        Retrieve the current balance of one of your business wallets. Balances are held per
        currency; omit the currency to get your home currency wallet.
      tags:
        - Wallet
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            type: string
            enum: [NGN, ZAR]
          description: >-
            ISO code of the wallet to read, in any case. Defaults to your business' home currency.
          example: ZAR
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      balance:
                        type: integer
                        example: 150000
                      currency:
                        type: string
                        example: NGN
        "404":
          description: This business has no wallet in the requested currency
        "422":
          description: The provided currency is not supported

  /v1/verification/bvn-check:
    post:
      summary: Verify BVN
      operationId: verifyBvn
      description: Verify a Bank Verification Number against provided names.
      tags:
        - Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - bvn
              properties:
                first_name:
                  type: string
                  example: John
                last_name:
                  type: string
                  example: Doe
                bvn:
                  type: string
                  example: "22345678901"
      responses:
        "200":
          description: BVN verified
        "400":
          description: Verification failed

  /v1/virtual-accounts:
    post:
      summary: Create Virtual Account
      operationId: createVirtualAccount
      description: Create a merchant-issued virtual account for a customer.
      tags:
        - Virtual Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - customer
              properties:
                type:
                  type: string
                  enum: [static, dynamic]
                customer:
                  type: object
                  properties:
                    reference:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                    email:
                      type: string
                    phone:
                      type: string
                    bvn:
                      type: string
                expected_amount:
                  type: integer
                meta:
                  type: object
      responses:
        "201":
          description: Virtual account created
        "422":
          description: Validation error
    get:
      summary: List Virtual Accounts
      operationId: listVirtualAccounts
      description: Returns a paginated list of virtual accounts.
      tags:
        - Virtual Accounts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
        - name: account_type
          in: query
          schema:
            type: string
            enum: [static, dynamic]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: customer_reference
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Success

  /v1/virtual-accounts/{uid}:
    get:
      summary: Get Virtual Account
      operationId: getVirtualAccount
      description: Returns details of a specific virtual account.
      tags:
        - Virtual Accounts
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
        "404":
          description: Not found

  /v1/virtual-accounts/{uid}/deactivate:
    post:
      summary: Deactivate Virtual Account
      operationId: deactivateVirtualAccount
      description: Deactivates a virtual account.
      tags:
        - Virtual Accounts
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
        "404":
          description: Not found

  /v1/virtual-accounts/{uid}/transactions:
    get:
      summary: List Virtual Account Transactions
      operationId: listVirtualAccountTransactions
      description: Returns transactions for a virtual account.
      tags:
        - Virtual Accounts
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Success
        "404":
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: Account
    description: Account verification and bank listing
  - name: Collection
    description: Accept payments from customers
  - name: Transfers
    description: Send money to bank accounts. Available in NGN and ZAR
  - name: Transactions
    description: Transaction history and details
  - name: Settlements
    description: Settlement management
  - name: Wallet
    description: Per-currency wallet balances
  - name: Verification
    description: Identity verification
  - name: Virtual Accounts
    description: Virtual account management
